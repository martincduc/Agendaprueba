name: Calidad SonarQube AGENDA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-agenda
  cancel-in-progress: false

jobs:
  calidad:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, sonarqube-agenda]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Python
        shell: bash
        run: |
          python3.11 -m venv .venv-sonar
          .venv-sonar/bin/python -m pip install -r requirements-dev.txt

      - name: Pruebas y cobertura
        shell: bash
        run: |
          mkdir -p reports
          .venv-sonar/bin/python -m pytest -q \
            --cov=app --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing --cov-fail-under=80

      - name: Analizar y esperar el Quality Gate
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: sonar-scanner

      - name: Conservar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-sonarqube
          path: reports/coverage.xml
          if-no-files-found: warn
          retention-days: 7
